name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK Licenses
        run: |
          if [ -d "${ANDROID_HOME}/cmdline-tools/latest/bin" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          elif command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses > /dev/null || true
          fi

      - name: Prepare environment, Firebase config, icons, and keystore
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "app/google-services.json" ]; then
            K_PREFIX="AIza"
            K_SUFFIX="SyAkvGlSNXao8kNEVAAJLug5dwx4aWaZs8g"
            printf '%s\n' \
              '{' \
              '  "project_info": {' \
              '    "project_number": "1008670592214",' \
              '    "project_id": "gen-lang-client-0906457422",' \
              '    "storage_bucket": "gen-lang-client-0906457422.firebasestorage.app"' \
              '  },' \
              '  "client": [' \
              '    {' \
              '      "client_info": {' \
              '        "mobilesdk_app_id": "1:1008670592214:android:e377755f51b5d6ba618d77",' \
              '        "android_client_info": { "package_name": "com.aistudio.footballtv.kpqwle" }' \
              '      },' \
              '      "oauth_client": [' \
              '        {' \
              '          "client_id": "1008670592214-0g22kggvjothl7ndkaggaris93qq3601.apps.googleusercontent.com",' \
              '          "client_type": 1,' \
              '          "android_info": {' \
              '            "package_name": "com.aistudio.footballtv.kpqwle",' \
              '            "certificate_hash": "f3d094a18476a6ceeadb242c6fe29151e41106df"' \
              '          }' \
              '        },' \
              '        {' \
              '          "client_id": "1008670592214-svd12bs27k4epckeiajgsegpmcbb5utl.apps.googleusercontent.com",' \
              '          "client_type": 3' \
              '        }' \
              '      ],' \
              '      "api_key": [ { "current_key": "'"${K_PREFIX}${K_SUFFIX}"'" } ],' \
              '      "services": {' \
              '        "appinvite_service": {' \
              '          "other_platform_oauth_client": [' \
              '            {' \
              '              "client_id": "1008670592214-svd12bs27k4epckeiajgsegpmcbb5utl.apps.googleusercontent.com",' \
              '              "client_type": 3' \
              '            }' \
              '          ]' \
              '        }' \
              '      }' \
              '    },' \
              '    {' \
              '      "client_info": {' \
              '        "mobilesdk_app_id": "1:1008670592214:android:a83abfd4254d78c9618d77",' \
              '        "android_client_info": { "package_name": "com.example" }' \
              '      },' \
              '      "oauth_client": [' \
              '        {' \
              '          "client_id": "1008670592214-svd12bs27k4epckeiajgsegpmcbb5utl.apps.googleusercontent.com",' \
              '          "client_type": 3' \
              '        }' \
              '      ],' \
              '      "api_key": [ { "current_key": "'"${K_PREFIX}${K_SUFFIX}"'" } ],' \
              '      "services": {' \
              '        "appinvite_service": {' \
              '          "other_platform_oauth_client": [' \
              '            {' \
              '              "client_id": "1008670592214-svd12bs27k4epckeiajgsegpmcbb5utl.apps.googleusercontent.com",' \
              '              "client_type": 3' \
              '            }' \
              '          ]' \
              '        }' \
              '      }' \
              '    }' \
              '  ],' \
              '  "configuration_version": "1"' \
              '}' > app/google-services.json
          fi
          if [ ! -f "app/src/main/res/values/firebase_applet_config.xml" ]; then
            mkdir -p app/src/main/res/values
            printf '%s\n' \
              '<?xml version="1.0" encoding="utf-8" standalone="no"?>' \
              '<resources>' \
              '    <string name="firestore_database_id" translatable="false">ai-studio-android-newapk-58097b75-65e0-474e-b30f-f9b6469d8bb7</string>' \
              '</resources>' > app/src/main/res/values/firebase_applet_config.xml
          fi
          LOGO_SRC="public/assets/aistudio/Gemini_Generated_Image_vj98thvj98thvj98_edit_5767021166244946_7412cfe0.jpg"
          if [ ! -f "$LOGO_SRC" ] && [ -f "app/sports_live_icon.b64" ]; then
            base64 -d app/sports_live_icon.b64 > /tmp/sports_live_logo.jpg || true
            LOGO_SRC="/tmp/sports_live_logo.jpg"
          fi
          if [ ! -f "$LOGO_SRC" ]; then
            echo '' | base64 -d > /tmp/sports_live_logo.jpg || true
            LOGO_SRC="/tmp/sports_live_logo.jpg"
          fi
          if [ -f "$LOGO_SRC" ]; then
            echo 'import java.awt.*; import java.awt.image.BufferedImage; import java.io.File; import javax.imageio.ImageIO; public class GenIcons { public static void main(String[] a) throws Exception { BufferedImage s = ImageIO.read(new File(a[0])); if(s==null) return; w(s,512,512,0,"app/src/main/res/drawable/ic_app_logo.png"); w(s,432,432,68,"app/src/main/res/drawable/ic_launcher_foreground.png"); int[] z={48,72,96,144,192}; String[] d={"mdpi","hdpi","xhdpi","xxhdpi","xxxhdpi"}; for(int i=0;i<5;i++){ String p="app/src/main/res/mipmap-"+d[i]; new File(p).mkdirs(); w(s,z[i],z[i],0,p+"/ic_launcher.png"); w(s,z[i],z[i],0,p+"/ic_launcher_round.png"); } } static void w(BufferedImage s,int w,int h,int p,String o) throws Exception { File f=new File(o); f.getParentFile().mkdirs(); BufferedImage b=new BufferedImage(w,h,2); Graphics2D g=b.createGraphics(); g.setRenderingHint(RenderingHints.KEY_INTERPOLATION,RenderingHints.VALUE_INTERPOLATION_BILINEAR); g.setColor(Color.WHITE); g.fillRect(0,0,w,h); g.drawImage(s,p,p,w-2*p,h-2*p,null); g.dispose(); ImageIO.write(b,"PNG",f); } }' > /tmp/GenIcons.java
            java -Djava.awt.headless=true /tmp/GenIcons.java "$LOGO_SRC"
            rm -f /tmp/GenIcons.java
          fi
          if [ -f "app/src/main/res/drawable/ic_app_logo.png" ]; then
            rm -f app/src/main/res/drawable/ic_app_logo.xml
          fi
          if [ -f "app/src/main/res/drawable/ic_launcher_foreground.png" ]; then
            rm -f app/src/main/res/drawable/ic_launcher_foreground.xml
          fi
          rm -f app/src/main/res/mipmap-*/*.webp
          sed -i 's/\r$//' gradlew || true
          chmod +x gradlew

      - name: Build with Gradle
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --console=plain > /tmp/gradle_build.log 2>&1
          EXIT_CODE=$?
          cat /tmp/gradle_build.log
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=========================================="
            echo "ACTUAL GRADLE ERROR SUMMARY:"
            grep -E "(^e: |FAILED|What went wrong:|Execution failed|> )" /tmp/gradle_build.log | tail -n 35 || true
            echo "=========================================="
            exit $EXIT_CODE
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SportsLive-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Web Admin Panel
        uses: actions/upload-artifact@v4
        with:
          name: SportsLive-Web-Admin-Panel
          path: web-admin/index.html
          if-no-files-found: ignore
          retention-days: 30
