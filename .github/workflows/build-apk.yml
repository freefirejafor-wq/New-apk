name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK Licenses
        run: |
          if [ -d "${ANDROID_HOME}/cmdline-tools/latest/bin" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          elif command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses > /dev/null || true
          fi

      - name: Prepare environment, icons, and keystore
        run: |
          touch .env
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          # Remove any stale duplicate XML vector icons so PNG icons never collide in mergeDebugResources
          rm -f app/src/main/res/drawable/ic_app_logo.xml
          rm -f app/src/main/res/drawable/ic_launcher_foreground.xml
          # Ensure PNG app logo and adaptive launcher icons exist from the uploaded Sports Live image
          LOGO_SRC="public/assets/aistudio/Gemini_Generated_Image_vj98thvj98thvj98_edit_5767021166244946_7412cfe0.jpg"
          if [ ! -f "$LOGO_SRC" ] && [ -f "app/sports_live_icon.b64" ]; then
            base64 -d app/sports_live_icon.b64 > /tmp/sports_live_logo.jpg
            LOGO_SRC="/tmp/sports_live_logo.jpg"
          fi
          if [ -f "$LOGO_SRC" ]; then
            echo 'import java.awt.*; import java.awt.image.BufferedImage; import java.io.File; import javax.imageio.ImageIO; public class GenIcons { public static void main(String[] a) throws Exception { BufferedImage s = ImageIO.read(new File(a[0])); w(s,512,512,0,"app/src/main/res/drawable/ic_app_logo.png"); w(s,432,432,68,"app/src/main/res/drawable/ic_launcher_foreground.png"); int[] z={48,72,96,144,192}; String[] d={"mdpi","hdpi","xhdpi","xxhdpi","xxxhdpi"}; for(int i=0;i<5;i++){ String p="app/src/main/res/mipmap-"+d[i]; new File(p).mkdirs(); w(s,z[i],z[i],0,p+"/ic_launcher.png"); w(s,z[i],z[i],0,p+"/ic_launcher_round.png"); } } static void w(BufferedImage s,int w,int h,int p,String o) throws Exception { File f=new File(o); f.getParentFile().mkdirs(); BufferedImage b=new BufferedImage(w,h,2); Graphics2D g=b.createGraphics(); g.setRenderingHint(RenderingHints.KEY_INTERPOLATION,RenderingHints.VALUE_INTERPOLATION_BILINEAR); g.setColor(Color.WHITE); g.fillRect(0,0,w,h); g.drawImage(s,p,p,w-2*p,h-2*p,null); g.dispose(); ImageIO.write(b,"PNG",f); } }' > /tmp/GenIcons.java
            java -Djava.awt.headless=true /tmp/GenIcons.java "$LOGO_SRC"
            rm -f /tmp/GenIcons.java
          fi
          sed -i 's/\r$//' gradlew || true
          chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SportsLive-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Web Admin Panel
        uses: actions/upload-artifact@v4
        with:
          name: SportsLive-Web-Admin-Panel
          path: web-admin/index.html
          retention-days: 30
